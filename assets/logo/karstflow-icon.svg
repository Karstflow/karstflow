      <feGaussianBlur stdDeviation="2.5" in="SourceGraphic" result="g2"/>
      <feBlend in="g7" in2="g2" mode="screen" result="blended"/>
      <feMerge><feMergeNode in="blended"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreGlow" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotHalo" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cloudShadow" x="-8%" y="-25%" width="116%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="cloudEdge" x="-6%" y="-30%" width="112%" height="165%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bitFx" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
