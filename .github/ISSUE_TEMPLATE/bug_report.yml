name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the details below.

        **Do not report security vulnerabilities here** — see SECURITY.md and
        report them privately instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `just dev`
        2. Send RPC request...
        3. Observe error...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, execution mode, etc.
      placeholder: |
        - OS: Ubuntu 24.04
        - Rust: 1.82.0
        - Mode: tokio / pinned / tile
        - Cluster: dev / devnet / testnet
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Relevant log output or error messages.
      render: shell
    validations:
      required: false
