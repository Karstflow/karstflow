[workspace]
members = [
  "crates/paradencer-core",
  "crates/paradencer-runtime",
  "crates/paradencer-mesh",
  "crates/paradencer-execution",
  "crates/paradencer-storage",
  "crates/paradencer-constants",
  "crates/paradencer-stages",
  "crates/paradencer-config",
  "crates/paradencer-observability",
  "crates/paradencer-rpc",
  "crates/paradencer-control",
  "crates/paradencer-topology",
  "crates/paradencer-node",
  "crates/paradencer-consensus",
  "crates/paradencer-sbpf",
  "crates/paradencer-types",
  "crates/paradencer-ids",
  "crates/paradencer-crypto",
  "crates/paradencer-net",
  "crates/paradencer-plugin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "SEE LICENSE IN LICENSE"
authors = ["boogvar"]

[workspace.dependencies]
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
] }
core_affinity = "0.8"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Cryptography
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
blake3 = "1.5"
tiny-keccak = { version = "2", features = ["keccak"] }
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
substrate-bn = "0.6"
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc"] }
light-poseidon = "0.2"
ark-bn254 = "0.4"
blst = "0.3"

# Encoding
bs58 = "0.5"
base64 = "0.22"
bytes = "1.9"
bincode = "1.3"
bv = { version = "0.11", features = ["serde"] }
serde-big-array = "0.5"

# Compression
zstd = "0.13"

# ZK proof verification
merlin = "3"
sha3 = "0.10"
subtle = "2.6"

# Random
rand = "0.8"
rand_chacha = "0.3"

# HTTP (lightweight sync client for snapshot download)
ureq = "3"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
parking_lot = "0.12"
dashmap = "6.1"
tempfile = "3.8"
memmap2 = "0.9"

# Internal crates
libloading = "0.8"
paradencer-constants = { path = "crates/paradencer-constants" }
paradencer-types = { path = "crates/paradencer-types" }
paradencer-crypto = { path = "crates/paradencer-crypto" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
