[package]
name = "paradencer-net"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "High-performance networking stack for Paradencer validator"

[dependencies]
paradencer-constants = { workspace = true }
paradencer-crypto = { path = "../paradencer-crypto" }

# Low-level system interfaces
libc = "0.2"

# Cryptography (TLS 1.3 primitives)
sha2 = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
aes-gcm = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { workspace = true }

# Utilities
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
hex = "0.4"

[features]
default = []
# Enable AF_XDP kernel-bypass networking (Linux only, requires CAP_SYS_ADMIN)
xdp = []
