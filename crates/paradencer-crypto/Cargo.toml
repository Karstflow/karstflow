[package]
name = "paradencer-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core", "batch"] }
blake3 = "1.5"
sha2 = "0.10"
hmac = "0.12"
curve25519-dalek = "4.1"
reed-solomon-erasure = "6.0"
tiny-keccak = { workspace = true }
k256 = { workspace = true }
p256 = { workspace = true }
substrate-bn = { workspace = true }

# Internal
paradencer-constants = { path = "../paradencer-constants" }

# Utilities
thiserror.workspace = true
bytes.workspace = true
serde = { workspace = true, optional = true }

# Parallel processing
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
hex-literal = "0.4"

[features]
default = []
serde = ["dep:serde"]

[[bench]]
name = "crypto_bench"
harness = false
